<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guilds - Tecnologia de Elite para Empresas | Desenvolvimento, IA & Inovação</title>
    <meta name="description" content="A Guilds é uma empresa de tecnologia especializada em desenvolvimento de software, automação com IA, jogos corporativos e consultoria digital. Transformamos negócios através de soluções inovadoras." />
    
    <!-- Inline critical CSS for faster FCP -->
    <style>
      /* Critical font-face declarations with font-display: swap */
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/sora/v13/xMQOuFFYT2USDC8Ly8ARrOshJB4.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      
      /* Critical layout styles */
      * { box-sizing: border-box; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
      body { 
        margin: 0; 
        font-family: Inter, system-ui, sans-serif; 
        line-height: 1.5; 
        font-weight: 400; 
        color: hsl(220 39% 11%); 
        background: hsl(0 0% 100%); 
        -webkit-font-smoothing: antialiased; 
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      
      /* Critical button styles */
      .btn-primary { 
        display: inline-flex; 
        align-items: center; 
        justify-content: center; 
        border-radius: 12px; 
        font-size: 0.875rem; 
        font-weight: 500; 
        background: hsl(240 85% 48%); 
        color: hsl(0 0% 100%); 
        border: 1px solid transparent; 
        padding: 0.5rem 1rem; 
        text-decoration: none; 
        cursor: pointer; 
        transition: background 150ms ease; 
      }
      .btn-primary:hover { background: hsl(240 85% 45%); }
    </style>
    <meta name="author" content="Guilds" />
    <meta name="keywords" content="desenvolvimento software, inteligência artificial, automação, jogos corporativos, consultoria digital, tecnologia empresarial" />

    <meta property="og:url" content="https://guilds.com.br" />
    <meta property="og:image" content="https://guilds.com.br/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guilds - Tecnologia de Elite para Empresas" />
    <meta name="twitter:description" content="Transformamos negócios através de soluções tecnológicas inovadoras." />
    <meta name="twitter:image" content="https://guilds.com.br/og-image.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://guilds.com.br" />
    
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://itvruukwhgttnjpvghzq.supabase.co" />
    
    <!-- DNS prefetch for additional performance -->
    <link rel="dns-prefetch" href="https://itvruukwhgttnjpvghzq.supabase.co" />
    
    <!-- Critical fonts loaded with proper async pattern -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" />
    
    <!-- Additional fonts loaded non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
